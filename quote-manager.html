<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Quotes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #FFF8F0;
      color: #1C1917;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #F97316;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header span { font-size: 22px; }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
    header p  { font-size: 12px; opacity: 0.88; margin-top: 1px; }

    .list-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 8px;
    }

    .empty {
      text-align: center;
      color: #A8A29E;
      margin-top: 40px;
      font-size: 14px;
      line-height: 1.8;
    }

    .quote-card {
      background: white;
      border: 1.5px solid #FED7AA;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .quote-card:hover { border-color: #FB923C; }
    .quote-card.editing { border-color: #F97316; background: #FFF7ED; }

    .quote-number {
      font-size: 11px;
      color: #F97316;
      font-weight: 700;
      min-width: 20px;
      padding-top: 2px;
    }

    .quote-text {
      flex: 1;
      font-size: 13.5px;
      line-height: 1.5;
      color: #292524;
      word-break: break-word;
    }

    .quote-input {
      flex: 1;
      font-size: 13.5px;
      line-height: 1.5;
      border: none;
      outline: none;
      background: transparent;
      color: #292524;
      resize: none;
      font-family: inherit;
      padding: 0;
    }

    .actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: background 0.12s;
    }
    .btn-edit:hover  { background: #FED7AA; }
    .btn-save:hover  { background: #BBF7D0; }
    .btn-delete:hover { background: #FECACA; }

    .add-area {
      padding: 12px 16px 16px;
      flex-shrink: 0;
      border-top: 1.5px solid #FED7AA;
      background: #FFF8F0;
    }

    .add-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    #new-quote {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid #FED7AA;
      border-radius: 9px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      background: white;
      resize: none;
      min-height: 40px;
      transition: border-color 0.15s;
    }
    #new-quote:focus { border-color: #F97316; }

    .btn-add {
      padding: 9px 16px;
      background: #F97316;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      height: 40px;
    }
    .btn-add:hover { background: #EA580C; }

    .count {
      font-size: 11px;
      color: #A8A29E;
      margin-bottom: 8px;
    }

    /* Scrollbar */
    .list-area::-webkit-scrollbar { width: 6px; }
    .list-area::-webkit-scrollbar-track { background: transparent; }
    .list-area::-webkit-scrollbar-thumb { background: #FED7AA; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <span>💬</span>
  <div>
    <h1>Your Quotes</h1>
    <p>These appear in your buddy's speech bubble</p>
  </div>
</header>

<div class="list-area" id="list"></div>

<div class="add-area">
  <div class="add-row">
    <textarea id="new-quote" placeholder="Type a new quote..." rows="1"></textarea>
    <button class="btn-add" onclick="addQuote()">Add</button>
  </div>
</div>

<script>
  let quotes = [];

  async function load() {
    quotes = await window.electronAPI.readQuotes() || [];
    render();
  }

  function render() {
    const list = document.getElementById('list');
    if (!quotes.length) {
      list.innerHTML = '<div class="empty">No quotes yet.<br>Add your first one below! 👇</div>';
      return;
    }
    list.innerHTML = `<div class="count">${quotes.length} quote${quotes.length !== 1 ? 's' : ''}</div>` +
      quotes.map((q, i) => `
        <div class="quote-card" id="card-${i}">
          <div class="quote-number">${i + 1}</div>
          <div class="quote-text" id="text-${i}">${escHtml(q)}</div>
          <div class="actions">
            <button class="btn-icon btn-edit" onclick="startEdit(${i})" title="Edit">✏️</button>
            <button class="btn-icon btn-delete" onclick="deleteQuote(${i})" title="Delete">🗑️</button>
          </div>
        </div>
      `).join('');
  }

  function startEdit(i) {
    const card = document.getElementById(`card-${i}`);
    const textEl = document.getElementById(`text-${i}`);
    card.classList.add('editing');
    textEl.outerHTML = `<textarea class="quote-input" id="text-${i}" rows="2" onblur="saveEdit(${i})" onkeydown="editKey(event,${i})">${escHtml(quotes[i])}</textarea>`;
    const input = document.getElementById(`text-${i}`);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    // Swap edit button to save button
    card.querySelector('.btn-edit').outerHTML =
      `<button class="btn-icon btn-save" onclick="saveEdit(${i})" title="Save">✅</button>`;
  }

  function editKey(e, i) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(i); }
    if (e.key === 'Escape') { load(); }
  }

  async function saveEdit(i) {
    const input = document.getElementById(`text-${i}`);
    if (!input || input.tagName !== 'TEXTAREA') return;
    const val = input.value.trim();
    if (val) {
      quotes[i] = val;
      await window.electronAPI.writeQuotes(quotes);
    }
    load();
  }

  async function deleteQuote(i) {
    quotes.splice(i, 1);
    await window.electronAPI.writeQuotes(quotes);
    render();
  }

  async function addQuote() {
    const input = document.getElementById('new-quote');
    const text = input.value.trim();
    if (!text) return;
    quotes.push(text);
    await window.electronAPI.writeQuotes(quotes);
    input.value = '';
    input.style.height = 'auto';
    render();
    // Scroll to bottom
    const list = document.getElementById('list');
    list.scrollTop = list.scrollHeight;
  }

  document.getElementById('new-quote').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addQuote(); }
  });

  // Auto-grow textarea
  document.getElementById('new-quote').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
  });

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  load();
</script>
</body>
</html>
