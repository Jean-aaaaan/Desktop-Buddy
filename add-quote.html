<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a Quote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #FFF8F0;
      padding: 20px 24px;
      color: #1C1917;
    }
    h3 { font-size: 15px; margin-bottom: 14px; color: #9A3412; }
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid #F97316;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    input[type="text"]:focus { border-color: #EA580C; }
    .row { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
    button {
      padding: 8px 18px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
    }
    .save { background: #F97316; color: #fff; font-weight: 600; }
    .save:hover { background: #EA580C; }
    .cancel { background: #E7E5E4; color: #44403C; }
    .cancel:hover { background: #D6D3D1; }
  </style>
</head>
<body>
  <h3>Add a motivational quote</h3>
  <input type="text" id="q" placeholder="Type your quote here..." autofocus maxlength="160">
  <div class="row">
    <button class="cancel" onclick="window.close()">Cancel</button>
    <button class="save" onclick="save()">Save</button>
  </div>
  <script>
    document.getElementById('q').addEventListener('keydown', e => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') window.close();
    });

    async function save() {
      const text = document.getElementById('q').value.trim();
      if (!text) return;
      const quotes = await window.electronAPI.readQuotes() || [];
      quotes.push(text);
      await window.electronAPI.writeQuotes(quotes);
      window.close();
    }
  </script>
</body>
</html>
